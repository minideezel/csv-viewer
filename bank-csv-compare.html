<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Reconciliation Diff Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/date-fns@3.6.0/cdn.min.js"></script>
    <style>
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #aaa; }
        .inter-font { font-family: 'Inter', sans-serif; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 inter-font p-6">

    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <nav class="mb-4">
            <a href="index.html" class="inline-block px-3 py-1 bg-gray-100 text-gray-800 rounded hover:bg-gray-200 text-sm">CSV Viewer</a>
        </nav>
        <header class="mb-8">
            <h1 class="text-3xl font-bold text-gray-900">CSV Reconciliation Diff</h1>
            <p class="text-gray-600 mt-2">Compare your bank statement against your budget to find missing transactions.</p>
        </header>

        <!-- Controls Area -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-200 mb-8">

            <!-- Budget Source Toggle -->
            <div class="mb-5 flex items-center gap-3">
                <span class="text-sm font-medium text-gray-700">Budget source:</span>
                <div class="inline-flex rounded-lg border border-gray-200 overflow-hidden">
                    <button id="modeCsvBtn" class="px-4 py-1.5 text-sm font-medium transition-colors">CSV File</button>
                    <button id="modeYnabBtn" class="px-4 py-1.5 text-sm font-medium transition-colors">YNAB</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                <!-- Bank CSV Input -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">1. Bank CSV (Source of Truth)</label>
                    <input type="file" id="bankCsv" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"/>
                    <div class="mt-2">
                        <label class="inline-flex items-center">
                            <input type="checkbox" id="invertBank" class="rounded border-gray-300 text-blue-600 shadow-sm focus:border-blue-300 focus:ring focus:ring-blue-200 focus:ring-opacity-50">
                            <span class="ml-2 text-sm text-gray-600">Invert Bank Amounts (+/-)</span>
                        </label>
                    </div>
                </div>

                <!-- Budget CSV section -->
                <div id="budgetCsvSection">
                    <label class="block text-sm font-medium text-gray-700 mb-2">2. Budget CSV</label>
                    <input type="file" id="budgetCsv" accept=".csv" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-50 file:text-purple-700 hover:file:bg-purple-100"/>
                </div>

                <!-- YNAB section -->
                <div id="budgetYnabSection" class="hidden">
                    <label class="block text-sm font-medium text-gray-700 mb-2">2. YNAB</label>
                    <div id="ynabUI"><!-- rendered by renderYnabUI() --></div>
                </div>

                <!-- Start Date -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">3. Start Comparing From</label>
                    <input type="date" id="startDate" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2 border">
                </div>

                <!-- Action -->
                <div class="flex items-end">
                    <button id="reconcileBtn" class="w-full py-2 px-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed">
                        Run Comparison
                    </button>
                </div>
            </div>
        </div>

        <!-- Error Messages -->
        <div id="errorContainer" class="hidden p-4 mb-6 bg-red-50 border-l-4 border-red-500 text-red-700"></div>

        <!-- Results Area -->
        <div id="resultsArea" class="hidden">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
                <div class="bg-white p-4 rounded-lg border shadow-sm">
                    <div class="text-sm text-gray-500">Total Matches</div>
                    <div id="statMatched" class="text-2xl font-bold text-green-600">-</div>
                </div>
                <div class="bg-white p-4 rounded-lg border shadow-sm">
                    <div class="text-sm text-gray-500">Unmatched Bank (Missing in Budget)</div>
                    <div id="statUnmatchedBank" class="text-2xl font-bold text-red-600">-</div>
                </div>
                <div class="bg-white p-4 rounded-lg border shadow-sm opacity-75">
                    <div class="text-sm text-gray-500">Unmatched Budget (Extra)</div>
                    <div id="statUnmatchedBudget" class="text-2xl font-bold text-gray-600">-</div>
                </div>
                <div class="bg-white p-4 rounded-lg border shadow-sm">
                    <div class="text-sm text-gray-500">Date Window Used</div>
                    <div class="text-2xl font-bold text-blue-600">±5 Days</div>
                </div>
            </div>

            <!-- Diff Table -->
            <div class="bg-white shadow-sm rounded-xl border border-gray-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-100">
                            <tr>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider w-24">Date</th>
                                <th class="px-4 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider w-10">Status</th>
                                <th class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider border-l border-r border-gray-200 bg-blue-50/50 w-5/12">Bank Transaction</th>
                                <th id="budgetColHeader" class="px-4 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider bg-purple-50/50 w-5/12">Matched Budget Entry</th>
                            </tr>
                        </thead>
                        <tbody id="diffTableBody" class="bg-white divide-y divide-gray-200 text-sm"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const { parseISO, parse, differenceInDays, isAfter, isEqual, format, startOfDay } = dateFns;

        const DATE_MATCH_WINDOW_DAYS = 5;

        // ========== IndexedDB ==========
        const DB_NAME = 'ynab_config';
        const DB_STORE = 'settings';

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, 1);
                req.onupgradeneeded = e => e.target.result.createObjectStore(DB_STORE);
                req.onsuccess = e => resolve(e.target.result);
                req.onerror = e => reject(e.target.error);
            });
        }

        async function dbGet(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction(DB_STORE, 'readonly').objectStore(DB_STORE).get(key);
                req.onsuccess = e => resolve(e.target.result ?? null);
                req.onerror = e => reject(e.target.error);
            });
        }

        async function dbSet(key, value) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).put(value, key);
                req.onsuccess = () => resolve();
                req.onerror = e => reject(e.target.error);
            });
        }

        async function dbDelete(key) {
            const db = await openDB();
            return new Promise((resolve, reject) => {
                const req = db.transaction(DB_STORE, 'readwrite').objectStore(DB_STORE).delete(key);
                req.onsuccess = () => resolve();
                req.onerror = e => reject(e.target.error);
            });
        }

        // ========== YNAB API ==========
        const YNAB_BASE = 'https://api.ynab.com/v1';

        async function ynabFetch(path, pat) {
            const resp = await fetch(`${YNAB_BASE}${path}`, {
                headers: { 'Authorization': `Bearer ${pat}` }
            });
            if (!resp.ok) {
                const body = await resp.json().catch(() => ({}));
                throw new Error(body.error?.detail || `YNAB API error ${resp.status}`);
            }
            return resp.json();
        }

        async function fetchBudgets(pat) {
            const data = await ynabFetch('/budgets', pat);
            return data.data.budgets;
        }

        async function fetchAccounts(pat, budgetId) {
            const data = await ynabFetch(`/budgets/${budgetId}/accounts`, pat);
            return data.data.accounts.filter(a => !a.deleted && !a.closed);
        }

        async function fetchYnabTransactions(pat, budgetId, accountId, sinceDate) {
            const data = await ynabFetch(
                `/budgets/${budgetId}/accounts/${accountId}/transactions?since_date=${sinceDate}`,
                pat
            );
            return data.data.transactions;
        }

        // Convert YNAB API transactions into the same normalized shape used by parseCSV()
        function ynabTxnsToNormalized(txns) {
            return txns.map(t => ({
                raw: t,
                type: 'budget',
                cleared: t.cleared, // 'cleared' | 'uncleared' | 'reconciled'
                normalized: {
                    date: startOfDay(parseISO(t.date)),
                    amount: t.amount / 1000, // YNAB uses milliunits
                    description: t.payee_name || t.memo || '(no description)'
                },
                matched: false,
                matchedWith: null
            }));
        }

        // ========== YNAB UI State ==========
        const ynab = {
            pat: null,
            budgets: [],
            selectedBudgetId: null,
            accounts: [],
            selectedAccountId: null,
            loading: false,
            error: null
        };

        let budgetMode = 'csv'; // 'csv' | 'ynab'

        // ========== Mode Toggle ==========
        const modeCsvBtn = document.getElementById('modeCsvBtn');
        const modeYnabBtn = document.getElementById('modeYnabBtn');
        const budgetCsvSection = document.getElementById('budgetCsvSection');
        const budgetYnabSection = document.getElementById('budgetYnabSection');

        function applyModeStyles() {
            const activeClass = 'bg-blue-600 text-white';
            const inactiveClass = 'text-gray-600 hover:bg-gray-50';
            if (budgetMode === 'csv') {
                modeCsvBtn.className = `px-4 py-1.5 text-sm font-medium transition-colors ${activeClass}`;
                modeYnabBtn.className = `px-4 py-1.5 text-sm font-medium transition-colors ${inactiveClass}`;
                budgetCsvSection.classList.remove('hidden');
                budgetYnabSection.classList.add('hidden');
                document.getElementById('budgetColHeader').textContent = 'Matched Budget Entry';
            } else {
                modeYnabBtn.className = `px-4 py-1.5 text-sm font-medium transition-colors ${activeClass}`;
                modeCsvBtn.className = `px-4 py-1.5 text-sm font-medium transition-colors ${inactiveClass}`;
                budgetCsvSection.classList.add('hidden');
                budgetYnabSection.classList.remove('hidden');
                document.getElementById('budgetColHeader').textContent = 'Matched YNAB Entry';
            }
        }

        modeCsvBtn.addEventListener('click', () => { budgetMode = 'csv'; applyModeStyles(); });
        modeYnabBtn.addEventListener('click', () => { budgetMode = 'ynab'; applyModeStyles(); renderYnabUI(); });

        // ========== YNAB UI ==========
        function renderYnabUI() {
            const container = document.getElementById('ynabUI');

            if (ynab.loading) {
                container.innerHTML = `
                    <div class="flex items-center gap-2 text-sm text-gray-500">
                        <svg class="animate-spin h-4 w-4 text-blue-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        Loading...
                    </div>`;
                return;
            }

            if (!ynab.pat) {
                container.innerHTML = `
                    <div class="space-y-2">
                        <input type="password" id="ynabPatInput" placeholder="Personal Access Token"
                            class="block w-full rounded-md border-gray-300 shadow-sm text-sm p-2 border focus:border-blue-500 focus:ring-blue-500"/>
                        <button id="ynabConnectBtn" class="w-full py-1.5 px-3 bg-purple-600 hover:bg-purple-700 text-white text-sm font-semibold rounded-lg shadow-sm transition-colors">
                            Connect to YNAB
                        </button>
                        ${ynab.error ? `<p class="text-xs text-red-600">${ynab.error}</p>` : ''}
                        <p class="text-xs text-gray-400">app.ynab.com → Account Settings → Developer Settings</p>
                    </div>`;
                document.getElementById('ynabConnectBtn').addEventListener('click', connectYnab);
                document.getElementById('ynabPatInput').addEventListener('keydown', e => { if (e.key === 'Enter') connectYnab(); });
                return;
            }

            // Connected state
            let html = `<div class="space-y-2">
                <div class="flex items-center justify-between">
                    <span class="text-xs font-medium text-green-700 flex items-center gap-1">
                        <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                        </svg>
                        Connected
                    </span>
                    <button id="ynabDisconnectBtn" class="text-xs text-gray-400 hover:text-red-500 underline">Disconnect</button>
                </div>`;

            if (ynab.budgets.length > 0) {
                html += `<select id="ynabBudgetSelect" class="block w-full rounded-md border-gray-300 shadow-sm text-sm p-2 border focus:border-blue-500">
                    <option value="">— Select Budget —</option>
                    ${ynab.budgets.map(b => `<option value="${b.id}"${b.id === ynab.selectedBudgetId ? ' selected' : ''}>${b.name}</option>`).join('')}
                </select>`;
            }

            if (ynab.selectedBudgetId && ynab.accounts.length > 0) {
                html += `<select id="ynabAccountSelect" class="block w-full rounded-md border-gray-300 shadow-sm text-sm p-2 border focus:border-blue-500">
                    <option value="">— Select Account —</option>
                    ${ynab.accounts.map(a => `<option value="${a.id}"${a.id === ynab.selectedAccountId ? ' selected' : ''}>${a.name} (${a.type})</option>`).join('')}
                </select>`;
            }

            if (ynab.error) {
                html += `<p class="text-xs text-red-600">${ynab.error}</p>`;
            }

            html += `</div>`;
            container.innerHTML = html;

            document.getElementById('ynabDisconnectBtn')?.addEventListener('click', disconnectYnab);

            document.getElementById('ynabBudgetSelect')?.addEventListener('change', async e => {
                ynab.selectedBudgetId = e.target.value || null;
                ynab.selectedAccountId = null;
                ynab.accounts = [];
                if (ynab.selectedBudgetId) {
                    await dbSet('lastBudgetId', ynab.selectedBudgetId);
                    await loadAccounts(ynab.selectedBudgetId);
                } else {
                    renderYnabUI();
                }
            });

            document.getElementById('ynabAccountSelect')?.addEventListener('change', async e => {
                ynab.selectedAccountId = e.target.value || null;
                if (ynab.selectedAccountId) await dbSet('lastAccountId', ynab.selectedAccountId);
                renderYnabUI();
            });
        }

        async function connectYnab() {
            const pat = document.getElementById('ynabPatInput')?.value?.trim();
            if (!pat) return;

            ynab.loading = true;
            ynab.error = null;
            renderYnabUI();

            try {
                const budgets = await fetchBudgets(pat);
                ynab.pat = pat;
                ynab.budgets = budgets;
                await dbSet('pat', pat);

                // Restore last selections if still valid
                const [lastBudgetId, lastAccountId] = await Promise.all([dbGet('lastBudgetId'), dbGet('lastAccountId')]);
                if (lastBudgetId && budgets.some(b => b.id === lastBudgetId)) {
                    ynab.selectedBudgetId = lastBudgetId;
                    const accounts = await fetchAccounts(pat, lastBudgetId);
                    ynab.accounts = accounts;
                    if (lastAccountId && accounts.some(a => a.id === lastAccountId)) {
                        ynab.selectedAccountId = lastAccountId;
                    }
                }
            } catch (err) {
                ynab.error = err.message;
            } finally {
                ynab.loading = false;
                renderYnabUI();
            }
        }

        async function disconnectYnab() {
            await Promise.all([dbDelete('pat'), dbDelete('lastBudgetId'), dbDelete('lastAccountId')]);
            Object.assign(ynab, { pat: null, budgets: [], selectedBudgetId: null, accounts: [], selectedAccountId: null, error: null });
            renderYnabUI();
        }

        async function loadAccounts(budgetId) {
            ynab.loading = true;
            ynab.error = null;
            renderYnabUI();
            try {
                ynab.accounts = await fetchAccounts(ynab.pat, budgetId);
            } catch (err) {
                ynab.error = err.message;
            } finally {
                ynab.loading = false;
                renderYnabUI();
            }
        }

        // ========== Initialization ==========
        async function init() {
            document.getElementById('startDate').valueAsDate = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
            applyModeStyles();

            // Restore stored YNAB session on load
            try {
                const storedPat = await dbGet('pat');
                if (!storedPat) return;

                budgetMode = 'ynab';
                applyModeStyles();
                ynab.loading = true;
                renderYnabUI();

                try {
                    const budgets = await fetchBudgets(storedPat);
                    ynab.pat = storedPat;
                    ynab.budgets = budgets;

                    const [lastBudgetId, lastAccountId] = await Promise.all([dbGet('lastBudgetId'), dbGet('lastAccountId')]);
                    if (lastBudgetId && budgets.some(b => b.id === lastBudgetId)) {
                        ynab.selectedBudgetId = lastBudgetId;
                        const accounts = await fetchAccounts(storedPat, lastBudgetId);
                        ynab.accounts = accounts;
                        if (lastAccountId && accounts.some(a => a.id === lastAccountId)) {
                            ynab.selectedAccountId = lastAccountId;
                        }
                    }
                } catch (_) {
                    // Stored PAT is invalid — clear and show connect form
                    await dbDelete('pat');
                    ynab.error = 'Stored token is invalid. Please reconnect.';
                } finally {
                    ynab.loading = false;
                    renderYnabUI();
                }
            } catch (_) {
                // IndexedDB unavailable — continue without persistence
            }
        }

        init();

        // ========== CSV Helpers ==========
        const findCol = (row, possibleNames) => {
            const headers = Object.keys(row);
            let match = headers.find(h => possibleNames.some(name => h.trim().toLowerCase() === name));
            if (!match) match = headers.find(h => possibleNames.some(name => h.toLowerCase().includes(name)));
            return match;
        };

        const normalizeAmount = (val) => {
            if (!val) return 0;
            let clean = val.toString().replace(/[$,\s]/g, '');
            if (clean.startsWith('(') && clean.endsWith(')')) clean = '-' + clean.replace(/[()]/g, '');
            return parseFloat(clean) || 0;
        };

        const normalizeDate = (dateStr) => {
            if (!dateStr) return null;
            let date = parseISO(dateStr);
            if (isNaN(date.getTime())) date = parse(dateStr, 'MM/dd/yyyy', new Date());
            if (isNaN(date.getTime())) date = parse(dateStr, 'dd/MM/yyyy', new Date());
            if (isNaN(date.getTime())) date = parse(dateStr, 'yyyy-MM-dd', new Date());
            if (isNaN(date.getTime())) date = new Date(dateStr);
            return isNaN(date.getTime()) ? null : startOfDay(date);
        };

        const parseCSV = (file, type, invertBank) => {
            return new Promise((resolve, reject) => {
                Papa.parse(file, {
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        const normalizedData = [];
                        if (results.data.length === 0) { resolve([]); return; }

                        const firstRow = results.data[0];
                        const dateCol = findCol(firstRow, ['date', 'posting date', 'txn date']);
                        const amtCol = findCol(firstRow, ['amount', 'amt', 'value']);
                        const descCol = findCol(firstRow, ['description', 'payee', 'notes', 'memo', 'merchant']);
                        const splitAmtCol = findCol(firstRow, ['split_amount', 'split amount']);

                        if (!dateCol || !amtCol) {
                            reject(new Error(`Could not auto-detect Date or Amount columns in ${type} CSV.`));
                            return;
                        }

                        results.data.forEach(row => {
                            if (!row[dateCol] && !row[amtCol]) return;
                            const description = descCol ? (row[descCol] || '').trim() : 'N/A';

                            if (type === 'budget' && /\(SPLIT \d+ OF \d+\)/i.test(description)) return;

                            let amount = normalizeAmount(row[amtCol]);
                            if (type === 'budget' && splitAmtCol && row[splitAmtCol]) {
                                const splitVal = normalizeAmount(row[splitAmtCol]);
                                if (splitVal !== 0) amount = splitVal;
                            }
                            if (type === 'bank' && invertBank) amount = amount * -1;

                            normalizedData.push({
                                raw: row,
                                type,
                                cleared: null,
                                normalized: { date: normalizeDate(row[dateCol]), amount, description },
                                matched: false,
                                matchedWith: null
                            });
                        });
                        resolve(normalizedData);
                    },
                    error: (err) => reject(err)
                });
            });
        };

        // ========== Run Comparison ==========
        const btn = document.getElementById('reconcileBtn');
        const errorContainer = document.getElementById('errorContainer');
        const resultsArea = document.getElementById('resultsArea');

        btn.addEventListener('click', async () => {
            errorContainer.classList.add('hidden');
            errorContainer.textContent = '';
            resultsArea.classList.add('hidden');
            btn.disabled = true;

            try {
                const bankFile = document.getElementById('bankCsv').files[0];
                const startDateInput = document.getElementById('startDate').value;
                const invertBank = document.getElementById('invertBank').checked;

                if (!bankFile || !startDateInput) throw new Error('Please select a bank CSV and a start date.');

                const START_DATE = startOfDay(parseISO(startDateInput));
                const bufferDate = new Date(START_DATE.getTime() - (DATE_MATCH_WINDOW_DAYS * 24 * 60 * 60 * 1000));
                const sinceDateStr = format(bufferDate, 'yyyy-MM-dd');

                let budgetTxns;

                if (budgetMode === 'csv') {
                    const budgetFile = document.getElementById('budgetCsv').files[0];
                    if (!budgetFile) throw new Error('Please select a budget CSV file.');
                    btn.textContent = 'Processing...';
                    budgetTxns = await parseCSV(budgetFile, 'budget', false);
                } else {
                    if (!ynab.pat) throw new Error('Please connect to YNAB first.');
                    if (!ynab.selectedBudgetId) throw new Error('Please select a YNAB budget.');
                    if (!ynab.selectedAccountId) throw new Error('Please select a YNAB account.');
                    btn.textContent = 'Fetching from YNAB...';
                    const rawTxns = await fetchYnabTransactions(ynab.pat, ynab.selectedBudgetId, ynab.selectedAccountId, sinceDateStr);
                    budgetTxns = ynabTxnsToNormalized(rawTxns);
                }

                btn.textContent = 'Processing...';
                const bankTxns = await parseCSV(bankFile, 'bank', invertBank);

                // Date filtering
                const bankFiltered = bankTxns.filter(t => t.normalized.date && (isAfter(t.normalized.date, START_DATE) || isEqual(t.normalized.date, START_DATE)));
                const budgetFiltered = budgetTxns.filter(t => t.normalized.date && isAfter(t.normalized.date, bufferDate));

                // Matching
                let matchCount = 0;
                const unmatchedBank = [];

                for (const bTxn of bankFiltered) {
                    const candidates = budgetFiltered.filter(bt =>
                        !bt.matched &&
                        Math.abs(bt.normalized.amount - bTxn.normalized.amount) < 0.01 &&
                        Math.abs(differenceInDays(bTxn.normalized.date, bt.normalized.date)) <= DATE_MATCH_WINDOW_DAYS
                    );

                    if (candidates.length > 0) {
                        candidates.sort((a, b) =>
                            Math.abs(differenceInDays(bTxn.normalized.date, a.normalized.date)) -
                            Math.abs(differenceInDays(bTxn.normalized.date, b.normalized.date))
                        );
                        const best = candidates[0];
                        best.matched = true;
                        bTxn.matched = true;
                        bTxn.matchedWith = best;
                        matchCount++;
                    } else {
                        unmatchedBank.push(bTxn);
                    }
                }

                const unmatchedBudget = budgetFiltered.filter(t => !t.matched && (isAfter(t.normalized.date, START_DATE) || isEqual(t.normalized.date, START_DATE)));

                renderResults(bankFiltered, unmatchedBudget, matchCount, unmatchedBank.length, unmatchedBudget.length);

            } catch (err) {
                console.error(err);
                errorContainer.textContent = err.message;
                errorContainer.classList.remove('hidden');
            } finally {
                btn.textContent = 'Run Comparison';
                btn.disabled = false;
            }
        });

        // ========== Cleared Status Badge ==========
        function clearedBadge(cleared) {
            if (!cleared) return '';
            const styles = {
                reconciled: { cls: 'bg-green-100 text-green-700', label: 'R', title: 'Reconciled' },
                cleared:    { cls: 'bg-blue-100 text-blue-700',  label: 'C', title: 'Cleared' },
                uncleared:  { cls: 'bg-yellow-100 text-yellow-700', label: 'U', title: 'Uncleared' }
            };
            const s = styles[cleared] || { cls: 'bg-gray-100 text-gray-600', label: '?', title: cleared };
            return `<span class="inline-flex items-center justify-center w-5 h-5 rounded text-xs font-bold flex-shrink-0 ${s.cls}" title="${s.title}">${s.label}</span>`;
        }

        // ========== Render Results ==========
        function renderResults(bankFiltered, unmatchedBudget, mCount, ubCount, uBudCount) {
            document.getElementById('statMatched').textContent = mCount;
            document.getElementById('statUnmatchedBank').textContent = ubCount;
            document.getElementById('statUnmatchedBudget').textContent = uBudCount;

            let displayRows = [];

            bankFiltered.forEach(bt => {
                displayRows.push({ date: bt.normalized.date, type: bt.matched ? 'MATCH' : 'BANK_ONLY', bank: bt, budget: bt.matchedWith || null });
            });
            unmatchedBudget.forEach(bt => {
                displayRows.push({ date: bt.normalized.date, type: 'BUDGET_ONLY', bank: null, budget: bt });
            });

            displayRows.sort((a, b) => b.date - a.date);

            const tbody = document.getElementById('diffTableBody');
            tbody.innerHTML = '';

            displayRows.forEach(row => {
                const tr = document.createElement('tr');
                let statusHtml, rowClass;

                if (row.type === 'MATCH') {
                    rowClass = 'bg-green-50 hover:bg-green-100 transition-colors';
                    statusHtml = '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">MATCH</span>';
                } else if (row.type === 'BANK_ONLY') {
                    rowClass = 'bg-red-50 hover:bg-red-100 transition-colors';
                    statusHtml = '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-red-100 text-red-800">MISSING</span>';
                } else {
                    rowClass = 'bg-gray-50 text-gray-500';
                    statusHtml = '<span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-gray-100 text-gray-800">EXTRA</span>';
                }

                tr.className = rowClass;

                const dateStr = format(row.date, 'MMM dd, yyyy');
                const bankAmt = row.bank ? row.bank.normalized.amount.toFixed(2) : '';
                const bankDesc = row.bank ? row.bank.normalized.description : '';
                const budgetAmt = row.budget ? row.budget.normalized.amount.toFixed(2) : '';
                let budgetDesc = row.budget ? row.budget.normalized.description : '';

                if (row.type === 'MATCH' && !isEqual(row.bank.normalized.date, row.budget.normalized.date)) {
                    const diff = differenceInDays(row.bank.normalized.date, row.budget.normalized.date);
                    budgetDesc = `<span class="text-xs text-blue-600 font-medium mr-1">[${diff > 0 ? '+' : ''}${diff}d]</span>${budgetDesc}`;
                }

                const badge = row.budget ? clearedBadge(row.budget.cleared) : '';

                tr.innerHTML = `
                    <td class="px-4 py-3 whitespace-nowrap text-sm font-medium">${dateStr}</td>
                    <td class="px-4 py-3 whitespace-nowrap text-center">${statusHtml}</td>
                    <td class="px-4 py-3 text-sm border-l border-r border-gray-200 ${row.bank ? '' : 'bg-gray-100'}">
                        ${row.bank ? `
                            <div class="flex justify-between items-center">
                                <span class="truncate pr-4" title="${bankDesc}">${bankDesc}</span>
                                <span class="font-mono flex-shrink-0 ${row.bank.normalized.amount < 0 ? 'text-red-700' : 'text-gray-800'}">${bankAmt}</span>
                            </div>` : ''}
                    </td>
                    <td class="px-4 py-3 text-sm ${row.budget ? '' : 'bg-gray-100'}">
                        ${row.budget ? `
                            <div class="flex justify-between items-center gap-2">
                                <div class="flex items-center gap-1.5 min-w-0">
                                    ${badge}
                                    <span class="truncate" title="${row.budget.normalized.description}">${budgetDesc}</span>
                                </div>
                                <span class="font-mono flex-shrink-0 ${row.budget.normalized.amount < 0 ? 'text-red-700' : 'text-gray-800'}">${budgetAmt}</span>
                            </div>` : ''}
                    </td>
                `;

                tbody.appendChild(tr);
            });

            resultsArea.classList.remove('hidden');
            resultsArea.scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
